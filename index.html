<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUKA MOTO | Visual Storyteller</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15171e;
            --border-color: #222634;
            --accent-color: #10b981;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; text-align: center; padding-top: 40px; }
        .brand-title { font-size: 28px; font-weight: 800; letter-spacing: 2px; margin-bottom: 5px; }
        .tagline { font-size: 13px; color: var(--text-muted); margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        .menu-grid { display: flex; flex-direction: column; gap: 15px; }
        .menu-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .menu-card:hover { border-color: var(--accent-color); background-color: #121f1a; }
        .arrow { color: var(--accent-color); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-title">SUKA MOTO</div>
    <div class="tagline">Visual Storyteller | Portrait & Editorial</div>

    <div class="menu-grid">
        <!-- URL Relatif & Bersih -->
        <a href="/graduates" class="menu-card">
            <span>Pricelist & Booking Graduates</span>
            <span class="arrow">→</span>
        </a>
    </div>
</div>

</body>
</html>
